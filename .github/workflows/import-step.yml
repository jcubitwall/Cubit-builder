# Scans a STEP file uploaded by an admin in the app and adds what's new to the libraries.
# Started by the site (functions/api/upload.js) with a one-hour signed link: through it the job fetches the file and a
# copy of the library (the databases), scans the file against that copy, and sends back what changed (functions/api/file.js).
# Nothing is committed: the library lives in the databases, not in the repo.
name: Import STEP
on:
  workflow_dispatch:
    inputs:
      id:       { description: 'Upload id', required: true }
      url:      { description: 'One-hour download link for the file', required: true }
      kind:     { description: 'wall | pod | home | unit-<type>-<L|R>-<in|out>', required: true }
      name:     { description: 'Name', required: true }
      filename: { description: 'Original file name', required: false }
      by:       { description: 'Uploaded by', required: false }
permissions:
  contents: read
concurrency:
  group: import-step      # one at a time, so library numbers never clash
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install the STEP reader
        run: pip install cadquery-ocp numpy shapely
      # inputs are passed through env (never pasted into the script) and checked before use
      - name: Fetch the file
        env:
          JOB_ID: ${{ inputs.id }}
          JOB_URL: ${{ inputs.url }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9]{14}-[a-z0-9]{1,8}$ ]] || { echo "bad id"; exit 1; }
          [[ "$JOB_URL" =~ ^https://([a-z0-9-]+\.)?cubit-builder\.pages\.dev/api/file\?id=[0-9]{14}-[a-z0-9]+\&exp=[0-9]+\&sig=[a-f0-9]{64}$ ]] || { echo "bad url"; exit 1; }
          mkdir -p incoming
          curl -fsS --max-time 300 -o "incoming/$JOB_ID.step" "$JOB_URL"
      - name: Fetch the library to scan against
        env:
          JOB_URL: ${{ inputs.url }}
        run: python3 -I tools/step-import/db_sync.py pull .
      - name: Scan and add to the libraries
        env:
          JOB_ID: ${{ inputs.id }}
          JOB_KIND: ${{ inputs.kind }}
          JOB_NAME: ${{ inputs.name }}
          JOB_FILE: ${{ inputs.filename }}
          JOB_BY: ${{ inputs.by }}
        run: python3 -I tools/step-import/run_job.py "incoming/$JOB_ID.step"
      - name: Send what's new to the databases
        env:
          JOB_URL: ${{ inputs.url }}
        run: python3 -I tools/step-import/db_sync.py push .
