# The database gateway Worker (see index.js). Deploy: cd workers/db && npm ci && npx wrangler deploy
# Then set its secret: npx wrangler secret put MONGODB_URI
name = "cubit-db"
main = "index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
MONGODB_DB = "cubit"

[[durable_objects.bindings]]
name = "HOLDER"
class_name = "MongoHolder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MongoHolder"]

# MariaDB through Hyperdrive (the id is the Hyperdrive configuration made in the dashboard)
# (cubit-mariadb: AWS RDS MariaDB 11.8 in ca-central-1, database "cubit", caching off so saves are seen at once)
[[hyperdrive]]
binding = "MARIADB"
id = "f700dfb88ada4786bbf9c1e4cdd4bb09"
